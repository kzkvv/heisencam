version: 0.18-0
mqtt:
  enabled: false
auth:
  enabled: false
tls:
  enabled: false
detectors:
  local:
    type: cpu
    num_threads: 2
ffmpeg:
  hwaccel_args: []
  input_args: -re -stream_loop -1 -fflags +genpts
  output_args:
    record: preset-record-generic
detect:
  enabled: true
  width: 960
  height: 540
  fps: 2
objects:
  track: [person, car]
birdseye:
  enabled: true
  mode: continuous
  idle_heartbeat_fps: 3
record:
  enabled: true
  continuous:
    days: 1
snapshots:
  enabled: true
cameras:
  fortieth_street:
    friendly_name: 40th Street crossing
    ffmpeg:
      inputs:
        - path: /demo/fortieth_street.mp4
          roles: [detect, record]
    ui:
      order: 1
  downtown_skywalk:
    friendly_name: Downtown skywalk
    detect:
      width: 800
      height: 600
    ffmpeg:
      inputs:
        - path: /demo/downtown_skywalk.mp4
          roles: [detect, record]
    ui:
      order: 2
  bay_bridge:
    friendly_name: Bay Bridge tower
    detect:
      width: 720
      height: 528
    ffmpeg:
      inputs:
        - path: /demo/bay_bridge.mp4
          roles: [detect, record]
    ui:
      order: 3
  twelfth_avenue:
    friendly_name: 12 Avenue corner
    detect:
      width: 800
      height: 600
    ffmpeg:
      inputs:
        - path: /demo/twelfth_avenue.mp4
          roles: [detect, record]
    ui:
      order: 4
  pacific_coast:
    friendly_name: Crenshaw Boulevard
    ffmpeg:
      inputs:
        - path: /demo/pacific_coast.mp4
          roles: [detect, record]
    ui:
      order: 5
  ninth_avenue:
    friendly_name: 9 Avenue crossing
    detect:
      width: 800
      height: 600
    ffmpeg:
      inputs:
        - path: /demo/ninth_avenue.mp4
          roles: [detect, record]
    ui:
      order: 6
